<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sticky Navbar</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Navbar */
        nav {
            position: sticky;
            top: 0;

            background-color: white;
            padding: 18px 40px;

            box-shadow: 0 3px 10px gray;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Logo */
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        /* Links */
        .links a {
            text-decoration: none;
            color: #333;
            margin-left: 25px;
            font-size: 16px;
            transition: 0.3s;
        }

        .links a:hover {
            color: #2563eb;
        }

        /* Main Content */
        section {
            height: 800px;
            padding: 50px;
            text-align: center;
        }

        section h1 {
            font-size: 40px;
            color: #222;
        }

        section p {
            font-size: 18px;
            color: #666;
        }

    </style>
</head>

<body>

    <nav>

        <div class="logo">
            MyWebsite
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <a href="task1.html">Back</a>
        </div>

    </nav>


    <section>

        <h1>Welcome to My Website</h1>

        <p>
            Scroll down and the navbar will stay at the top.
        </p>

    </section>

</body>

</html>
