<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toast Notification</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;

            border: none;
            border-radius: 5px;

            cursor: pointer;
            color: white;
        }

        .success-btn {
            background-color: green;
        }

        .error-btn {
            background-color: red;
        }

        .warning-btn {
            background-color: orange;
        }

        .info-btn {
            background-color: blue;
        }


        /* Toast Container */

        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
        }


        /* Toast */

        .toast {
            min-width: 250px;
            padding: 15px 20px;

            margin-bottom: 10px;

            color: white;
            border-radius: 5px;

            box-shadow: 0 0 10px #999;
        }

        .success {
            background-color: green;
        }

        .error {
            background-color: red;
        }

        .warning {
            background-color: orange;
        }

        .info {
            background-color: blue;
        }

    </style>

</head>

<body>

    <a href="task1.html">Back</a>

    <h1>Toast Notification System</h1>

    <button class="success-btn" onclick="showToast('Success!', 'success')">
        Success
    </button>

    <button class="error-btn" onclick="showToast('Something went wrong!', 'error')">
        Error
    </button>

    <button class="warning-btn" onclick="showToast('Please check your input!', 'warning')">
        Warning
    </button>

    <button class="info-btn" onclick="showToast('New message received!', 'info')">
        Info
    </button>


    <!-- Toasts will appear here -->

    <div id="toastContainer"></div>


    <script>

        function showToast(message, type) {

            // New toast element create karo
            var toast = document.createElement("div");

            // Toast ki classes add karo
            toast.className = "toast " + type;

            // Toast ka message set karo
            toast.innerText = message;

            // Toast ko container me add karo
            document.getElementById("toastContainer").appendChild(toast);


            // 3 seconds ke baad toast remove karo
            setTimeout(function() {

                toast.remove();

            }, 3000);

        }

    </script>

</body>

</html>
