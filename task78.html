<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Sorting</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .sort-box {
            text-align: right;
            margin-bottom: 20px;
        }

        .sort-box select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin-bottom: 5px;
        }

        .category {
            color: #777;
            font-size: 14px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .product button {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 768px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .products {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header>
        <h1>My Product Store</h1>
    </header>


    <div class="container">

        <h2>Products</h2>

        <a href="task1.html">Back</a>


        <!-- Sorting -->

        <div class="sort-box">

            <label for="sort">
                Sort By:
            </label>

            <select id="sort" onchange="sortProducts()">

                <option value="default">
                    Default
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

            </select>

        </div>


        <!-- Product List -->

        <div class="products" id="productList"></div>

    </div>


    <script>

        // Product data

        var products = [

            {
                name: "Smart Watch",
                category: "Electronics",
                price: 2500,
                image: "https://via.placeholder.com/400x300?text=Smart+Watch"
            },

            {
                name: "Running Shoes",
                category: "Fashion",
                price: 1800,
                image: "https://via.placeholder.com/400x300?text=Running+Shoes"
            },

            {
                name: "Headphones",
                category: "Electronics",
                price: 1500,
                image: "https://via.placeholder.com/400x300?text=Headphones"
            },

            {
                name: "Backpack",
                category: "Accessories",
                price: 1200,
                image: "https://via.placeholder.com/400x300?text=Backpack"
            },

            {
                name: "Sunglasses",
                category: "Fashion",
                price: 900,
                image: "https://via.placeholder.com/400x300?text=Sunglasses"
            },

            {
                name: "T-Shirt",
                category: "Clothing",
                price: 700,
                image: "https://via.placeholder.com/400x300?text=T-Shirt"
            }

        ];


        // Display products

        function displayProducts(productArray) {

            var productList =
                document.getElementById("productList");

            productList.innerHTML = "";


            for (var i = 0; i < productArray.length; i++) {

                var product = productArray[i];


                var productCard =
                    document.createElement("div");

                productCard.className = "product";


                productCard.innerHTML = `

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <h3>
                        ${product.name}
                    </h3>

                    <p class="category">
                        ${product.category}
                    </p>

                    <p class="price">
                        ₹${product.price}
                    </p>

                    <button onclick="addToCart('${product.name}')">
                        Add to Cart
                    </button>

                `;


                productList.appendChild(productCard);

            }

        }


        // Sort products

        function sortProducts() {

            var sortValue =
                document.getElementById("sort").value;


            if (sortValue === "low") {

                products.sort(function(a, b) {
                    return a.price - b.price;
                });

            }


            else if (sortValue === "high") {

                products.sort(function(a, b) {
                    return b.price - a.price;
                });

            }


            displayProducts(products);

        }


        // Add to cart

        function addToCart(productName) {

            alert(productName + " added to cart!");

        }


        // Display products when page loads

        displayProducts(products);

    </script>

</body>

</html>
