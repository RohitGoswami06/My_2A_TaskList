<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Filter</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* Filter Buttons */

        .filters {
            text-align: center;
            margin-bottom: 30px;
        }

        .filters button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #ddd;
            cursor: pointer;
        }

        .filters button:hover {
            background-color: #bbb;
        }

        /* Product Grid */

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin-bottom: 5px;
        }

        .category {
            color: #777;
            font-size: 14px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .product button {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 768px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .products {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header>
        <h1>My Product Store</h1>
    </header>


    <div class="container">

        <h2>Products</h2>

        <a href="index.html">Back</a>


        <!-- Filter Buttons -->

        <div class="filters">

            <button onclick="filterProducts('All')">
                All
            </button>

            <button onclick="filterProducts('Electronics')">
                Electronics
            </button>

            <button onclick="filterProducts('Fashion')">
                Fashion
            </button>

            <button onclick="filterProducts('Accessories')">
                Accessories
            </button>

            <button onclick="filterProducts('Clothing')">
                Clothing
            </button>

        </div>


        <!-- Product List -->

        <div class="products" id="productList"></div>

    </div>


    <script>

        // Product data

        var products = [

            {
                name: "Smart Watch",
                category: "Electronics",
                price: 2500,
                image: "https://via.placeholder.com/400x300?text=Smart+Watch"
            },

            {
                name: "Headphones",
                category: "Electronics",
                price: 1500,
                image: "https://via.placeholder.com/400x300?text=Headphones"
            },

            {
                name: "Running Shoes",
                category: "Fashion",
                price: 1800,
                image: "https://via.placeholder.com/400x300?text=Running+Shoes"
            },

            {
                name: "Sunglasses",
                category: "Fashion",
                price: 900,
                image: "https://via.placeholder.com/400x300?text=Sunglasses"
            },

            {
                name: "Backpack",
                category: "Accessories",
                price: 1200,
                image: "https://via.placeholder.com/400x300?text=Backpack"
            },

            {
                name: "T-Shirt",
                category: "Clothing",
                price: 700,
                image: "https://via.placeholder.com/400x300?text=T-Shirt"
            }

        ];


        // Display products

        function displayProducts(productArray) {

            var productList =
                document.getElementById("productList");

            productList.innerHTML = "";


            for (var i = 0; i < productArray.length; i++) {

                var product = productArray[i];


                var productCard =
                    document.createElement("div");

                productCard.className = "product";


                productCard.innerHTML = `

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <h3>
                        ${product.name}
                    </h3>

                    <p class="category">
                        ${product.category}
                    </p>

                    <p class="price">
                        ₹${product.price}
                    </p>

                    <button onclick="addToCart('${product.name}')">
                        Add to Cart
                    </button>

                `;


                productList.appendChild(productCard);

            }

        }


        // Filter products

        function filterProducts(category) {

            if (category === "All") {

                displayProducts(products);

            } else {

                var filteredProducts = [];


                for (var i = 0; i < products.length; i++) {

                    if (products[i].category === category) {

                        filteredProducts.push(products[i]);

                    }

                }


                displayProducts(filteredProducts);

            }

        }


        // Add to cart

        function addToCart(productName) {

            alert(productName + " added to cart!");

        }


        // Show all products when page loads

        displayProducts(products);

    </script>

</body>

</html>
