<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .stopwatch {
            background-color: white;
            width: 350px;
            padding: 30px;
            text-align: center;

            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        #display {
            font-size: 45px;
            font-weight: bold;
            margin: 25px 0;
        }

        button {
            padding: 10px 20px;
            margin: 5px;

            border: none;
            border-radius: 5px;

            cursor: pointer;
            font-size: 16px;
        }

        .start {
            background-color: green;
            color: white;
        }

        .pause {
            background-color: orange;
            color: white;
        }

        .reset {
            background-color: red;
            color: white;
        }
    </style>

</head>

<body>

    <div class="stopwatch">

        <h2>Stopwatch</h2>

        <div id="display">
            00:00:00
        </div>

        <button class="start" onclick="startStopwatch()">
            Start
        </button>

        <button class="pause" onclick="pauseStopwatch()">
            Pause
        </button>

        <button class="reset" onclick="resetStopwatch()">
            Reset
        </button>

        <a href="index.html">Back</a>

    </div>


    <script>

        var seconds = 0;

        var timer = null;


        // Start stopwatch
        function startStopwatch() {

            // Agar stopwatch already running hai
            if (timer !== null) {
                return;
            }

            timer = setInterval(function() {

                seconds++;

                updateDisplay();

            }, 1000);
        }


        // Pause stopwatch
        function pauseStopwatch() {

            clearInterval(timer);

            timer = null;
        }


        // Reset stopwatch
        function resetStopwatch() {

            clearInterval(timer);

            timer = null;

            seconds = 0;    

            updateDisplay();
        }

        
        // Display update
        function updateDisplay() {

            var hours = Math.floor(seconds / 3600);

            var minutes = Math.floor((seconds % 3600) / 60);

            var remainingSeconds = seconds % 60;


            // Single digit ke aage 0 lagana
            if (hours < 10) {
                hours = "0" + hours;
            }

            if (minutes < 10) {
                minutes = "0" + minutes;
            }

            if (remainingSeconds < 10) {
                remainingSeconds = "0" + remainingSeconds;
            }


            document.getElementById("display").innerText =
                hours + ":" + minutes + ":" + remainingSeconds;
        }

    </script>

</body>

</html>
