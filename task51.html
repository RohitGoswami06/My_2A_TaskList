<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal Popup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background-color: #f2f2f2;
        }

        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Modal background */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        /* Modal box */
        .modal-box {
            background-color: white;
            width: 350px;
            margin: 150px auto;
            padding: 30px;
            border-radius: 10px;
        }

        .close-btn {
            background-color: red;
        }
        </style>
</head>

<body>
    
    <h1>DOM Modal Example</h1>
    <a href="task1.html" style="color: black;">back</a>

    <p>Click the button to open the popup.</p>

    <button onclick="openModal()">
        Open Modal
    </button>


    <!-- Modal -->
    <div id="modal">

        <div class="modal-box">

            <h2>Hello!</h2>

            <p>
                This is a simple modal popup created using JavaScript.
            </p>

            <button class="close-btn" onclick="closeModal()">
                Close
            </button>

        </div>

    </div>


    <script>

        // Open Modal
        function openModal() {

            document.getElementById("modal").style.display = "block";

        }


        // Close Modal
        function closeModal() {

            document.getElementById("modal").style.display = "none";

        }

    </script>

</body>
</html>
