<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collapsible Sidebar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">

                <!-- Toggle Button -->
                <button class="btn btn-light w-100 mb-3"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#sidebarMenu"
                    aria-expanded="true"
                    aria-controls="sidebarMenu">

                    <i class="bi bi-list me-2"></i>
                    Menu

                </button>


                <!-- Sidebar Menu -->
                <div class="collapse show" id="sidebarMenu">

                    <div class="d-grid gap-2">

                        <a href="#"
                            class="btn btn-primary text-start">

                            <i class="bi bi-house me-2"></i>
                            Dashboard

                        </a>

                        <a href="#"
                            class="btn btn-dark text-white text-start">

                            <i class="bi bi-person me-2"></i>
                            Users

                        </a>

                        <a href="#"
                            class="btn btn-dark text-white text-start">

                            <i class="bi bi-box me-2"></i>
                            Products

                        </a>

                        <a href="#"
                            class="btn btn-dark text-white text-start">

                            <i class="bi bi-gear me-2"></i>
                            Settings

                        </a>

                        <a href="task1.html" class="btn btn-dark text-start"> Back</a>

                    </div>

                </div>

            </div>


            <!-- Main Content -->
            <main class="col-md-9 col-lg-10 p-4">

                <h1 class="fw-bold">
                    Dashboard
                </h1>

                <p class="text-secondary">
                    Welcome to the admin dashboard.
                </p>

                <div class="row g-4 mt-2">

                    <div class="col-md-4">

                        <div class="bg-light p-4 rounded shadow-sm">

                            <h5>Total Users</h5>

                            <h2 class="fw-bold">
                                1,250
                            </h2>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="bg-light p-4 rounded shadow-sm">

                            <h5>Products</h5>

                            <h2 class="fw-bold">
                                350
                            </h2>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="bg-light p-4 rounded shadow-sm">

                            <h5>Orders</h5>

                            <h2 class="fw-bold">
                                890
                            </h2>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>


    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
