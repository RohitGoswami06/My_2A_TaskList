<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions</title>

    <style>
        body {
            text-align: center;
            background-color: #f2f2f2;
        }

        /* Button */
        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;

            /* Smooth transition */
            transition: 0.3s;
        }

        button:hover {
            background-color: darkblue;
            transform: scale(1.1);
        }

        /* Cards */
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background-color: white;
            width: 200px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;

            /* Smooth transition */
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 5px 15px gray;
        }

        a {
            display: inline-block;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <h1>CSS Transition Example</h1>

    <button>Hover Me</button>

    <div class="container">

        <div class="card">
            <h2>Card 1</h2>
            <p>This is first card.</p>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is second card.</p>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is third card.</p>
        </div>

    </div>
    <a href="index.html" ">Back</a>   
    
</body>

</html>
