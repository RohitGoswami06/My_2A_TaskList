<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counter App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <h1>Counter App</h1>

    <h2 id="count">0</h2>

    <button onclick="increment()" class="btn btn-success">Increment</button>
    <button onclick="decrement()" class="btn btn-danger">Decrement</button>
    <button onclick="reset()" class="btn btn-warning">Reset</button>
    <a href="task1.html" class="btn btn-primary"> Back</a>

    <script>

        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrement() {
            count--;
            document.getElementById("count").innerText = count;
        }

        function reset() {
            count = 0;
            document.getElementById("count").innerText = count;
        }

    </script>

</body>

</html>
