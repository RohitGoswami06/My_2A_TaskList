
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 40px;
        }

        .form-container {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px #ccc;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #4a90e2;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }

    </style>
</head>

<body>

     <a href="task1.html">Back</a>

    <div class="form-container">

        <h1>Event Registration</h1>

        <form>

            <!-- Name -->
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
                pattern="[A-Za-z ]+"
                title="Please enter letters and spaces only">


            <!-- Email -->
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required>


            <!-- Phone -->
            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="10 digit phone number"
                required
                pattern="[0-9]{10}"
                title="Please enter exactly 10 digits">


            <!-- Event -->
            <label for="event">Select Event</label>

            <select id="event" name="event" required>

                <option value="">-- Select Event --</option>
                <option value="web">Web Development Workshop</option>
                <option value="java">Java Workshop</option>
                <option value="ai">AI Seminar</option>
                <option value="career">Career Seminar</option>

            </select>


            <!-- Date -->
            <label for="date">Event Date</label>

            <input      
                type="date"
                id="date"
                name="date"
                required>


            <!-- Number of people -->
            <label for="people">Number of People</label>

            <input
                type="number"
                id="people"
                name="people"
                min="1"
                max="10"
                required>


            <!-- Submit -->
            <button type="submit">
                Register Now
            </button>

        </form>

    </div>

</body>

</html>
