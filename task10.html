<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Demo</title>

    <style>
        body {
            font-family: Arial;
            /* margin: 20px; */
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px; 
            display: flex;
            justify-content: space-between;
        }

        nav{
            margin-top: 30px;
        }

        nav a {
            color: white;
            margin-right: 15px;
        }

        main {
            margin-top: 20px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a> 
            <a href="index.html">Back</a>
        </nav>
    </header>

    <main>

        <h2>Contact Us</h2>

        <p>Fill the form below to contact us.</p>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <button type="submit">Submit</button>
        </form>

        <br>

        <img src="image.jpg" alt="People working together">

    </main>

</body>

</html>
