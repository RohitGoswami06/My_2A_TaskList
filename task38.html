<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Loading Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
</head>

<body>

    <h2 id="message">Click the button to load data</h2>

    <button onclick="loadData(showResult)">Load Data</button>
    <a href="task1.html" class="btn btn-primary"> Back</a>


    <script>

        function loadData(callback) {

            document.getElementById("message").innerText = "Loading...";

            setTimeout(function () {
                callback();
            }, 2000);
        }

        function showResult() {
            document.getElementById("message").innerText = "Data Loaded Successfully!";
        }

    </script>

</body>

</html>
