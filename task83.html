<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Error Handling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        #loader {
            text-align: center;
            font-size: 20px;
            margin: 30px;
        }

        #errorBox {
            display: none;
            background-color: #ffe5e5;
            color: #c00000;
            padding: 20px;
            max-width: 500px;
            margin: 30px auto;
            text-align: center;
            border-radius: 8px;
        }

        #retryBtn {
            background-color: #c00000;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        #retryBtn:hover {
            background-color: #900000;
        }

        #posts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 20px;
            text-transform: capitalize;
        }

        .card p {
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <h1>Posts From API</h1>

    <a href="index.html">Back</a>

    <!-- Loader -->
    <div id="loader">
        Loading...
    </div>


    <!-- Error Message -->
    <div id="errorBox">

        <h2>Oops! Something went wrong.</h2>

        <p id="errorMessage">
            Data load nahi ho saka.
        </p>

        <button id="retryBtn" onclick="loadData()">
            Try Again
        </button>

    </div>


    <!-- API Data -->
    <div id="posts"></div>


    <script>

        function loadData() {

            // Loader show
            document.getElementById("loader").style.display = "block";

            // Error hide
            document.getElementById("errorBox").style.display = "none";

            // Purana data remove
            document.getElementById("posts").innerHTML = "";


            // API call
            fetch("https://jsonplaceholder.typicode.com/posts")

                .then(function(response) {

                    // Agar server response successful nahi hai
                    if (!response.ok) {
                        throw new Error("Server error: " + response.status);
                    }

                    return response.json();
                })


                .then(function(data) {

                    // Loader hide
                    document.getElementById("loader").style.display = "none";


                    var posts = document.getElementById("posts");


                    // First 10 posts display
                    for (var i = 0; i < 10; i++) {

                        var card = document.createElement("div");

                        card.className = "card";

                        card.innerHTML = `
                            <h2>${data[i].title}</h2>
                            <p>${data[i].body}</p>
                        `;

                        posts.appendChild(card);
                    }

                })


                .catch(function(error) {

                    // Loader hide
                    document.getElementById("loader").style.display = "none";

                    // Error message show
                    document.getElementById("errorBox").style.display = "block";

                    document.getElementById("errorMessage").innerText =
                        "Data load nahi ho saka. Please try again.";

                    console.log(error);

                });
        }


        // Page load hote hi API call
        loadData();

    </script>

</body>
</html>
