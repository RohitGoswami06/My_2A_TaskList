<!DOCTYPE html>
<html>
<head>
    <title>Student Marks</title>

      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>

    <a href="task1.html" class="btn btn-primary">Back</a>

    <h2>Student Marks</h2>

    <h3>Original Students</h3>
    <p id="original"></p>

    <h3>map() - Updated Marks</h3>
    <p id="map"></p>

    <h3>filter() - Passed Students</h3>
    <p id="filter"></p>

    <h3>reduce() - Total Marks</h3>
    <p id="reduce"></p>

    <script>

        let students = [
            { name: "Rohit", marks: 85 },
            { name: "Aman", marks: 72 },
            { name: "Rahul", marks: 45 },
            { name: "Vikas", marks: 90 },
            { name: "Neha", marks: 65 }
        ];

        // Original data
        document.getElementById("original").innerText =
            students.map(student => student.name + " : " + student.marks).join(", ");


        // map()
        let updatedMarks = students.map(function(student) {
            return student.marks + 5;
        });

        document.getElementById("map").innerText =
            updatedMarks.join(", ");


        // filter()
        let passedStudents = students.filter(function(student) {
            return student.marks >= 60;
        });

        document.getElementById("filter").innerText =
            passedStudents.map(student => student.name).join(", ");


        // reduce()
        let totalMarks = students.reduce(function(total, student) {
            return total + student.marks;
        }, 0);

        document.getElementById("reduce").innerText =
            totalMarks;

    </script>

</body>
</html>
