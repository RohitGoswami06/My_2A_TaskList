<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Main Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr;
            min-height: 100vh;
        }

        /* Header */
        header {
            grid-column: 1 / 3;
            background-color: blue;
            color: white;
            padding: 20px;
        }

        /* Sidebar */
        aside {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        aside a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 20px 0;
        }

        /* Main Content */
        main {
            padding: 25px;
        }

        /* Cards Grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .card h2 {
            margin: 0;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Header -->
        <header>
            <h2>My Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <aside>
            <h3>Menu</h3>

            <a href="#">Home</a>
            <a href="#">Users</a>
            <a href="#">Orders</a>
            <a href="#">Settings</a>
            <a href="task1.html">Back</a>
        </aside>

        <!-- Main Content -->
        <main>

            <h1>Dashboard</h1>

            <div class="cards">

                <div class="card">
                    <h2>Users</h2>
                    <p class="number">120</p>
                </div>

                <div class="card">
                    <h2>Orders</h2>
                    <p class="number">80</p>
                </div>

                <div class="card">
                    <h2>Sales</h2>
                    <p class="number">₹50,000</p>
                </div>

                <div class="card">
                    <h2>Products</h2>
                    <p class="number">45</p>
                </div>

                <div class="card">
                    <h2>Visitors</h2>
                    <p class="number">950</p>
                </div>

                <div class="card">
                    <h2>Messages</h2>
                    <p class="number">25</p>
                </div>

            </div>

        </main>

    </div>

</body>

</html>
