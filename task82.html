<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Loader</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        /* Loader */
        #loader {
            width: 50px;
            height: 50px;
            border: 6px solid #ddd;
            border-top: 6px solid #222;
            border-radius: 50%;
            animation: spin 1s linear infinite;

            margin: 40px auto;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Posts */
        #posts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 20px;
            text-transform: capitalize;
        }

        .card p {
            color: #555;
            line-height: 1.5;
        }

        #error {
            text-align: center;
            color: red;
        }
    </style>
</head>

<body>

    <h1>Posts From API</h1>
    <a href="task1.html">Back</a>

    <!-- Loading Spinner -->
    <div id="loader"></div>

    <!-- API Data -->
    <div id="posts"></div>

    <!-- Error Message -->
    <p id="error"></p>


    <script>

        // API call
        fetch("https://jsonplaceholder.typicode.com/posts")

            .then(function(response) {

                return response.json();

            })

            .then(function(data) {

                // API data mil gaya
                // Ab loader hide karo
                document.getElementById("loader").style.display = "none";


                var posts = document.getElementById("posts");


                // First 10 posts show karenge
                for (var i = 0; i < 10; i++) {

                    var card = document.createElement("div");

                    card.className = "card";

                    card.innerHTML = `
                        <h2>${data[i].title}</h2>
                        <p>${data[i].body}</p>
                    `;

                    posts.appendChild(card);
                }

            })

            .catch(function(error) {

                // Error hone par loader hide
                document.getElementById("loader").style.display = "none";

                document.getElementById("error").innerText =
                    "Data load nahi ho saka.";

                console.log(error);

            });

    </script>

</body>
</html>
