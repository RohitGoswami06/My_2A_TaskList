<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Theme</title>

    <style>
        /* CSS Variables */
        :root {
            --primary-color: #2563eb;
            --secondary-color: #f1f5f9;
            --text-color: #222;
            --white-color: white;
            --button-color: #1d4ed8;
        }

        body {
            margin: 0;
            background-color: var(--secondary-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--primary-color);
            color: var(--white-color);
            padding: 20px;
            text-align: center;
        }

        main {
            margin: 30px auto;
            background-color: var(--white-color);
            padding: 25px;
            text-align: center;
        }

        button {
            background-color: var(--button-color);
            color: var(--white-color);
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: var(--secondary-color);
        }

        footer {
            background-color: var(--primary-color);
            color: var(--white-color);
            text-align: center;
            padding: 15px;

        }
    </style>
</head>

<body>



    <header>
        <h1>My Website</h1>
        <p>CSS Variables Color Theme</p>
    </header>

    <main>
        <h2>Welcome!</h2>
        <p>
            This website uses CSS variables to manage its colors.
        </p>

        <button><a href="index.html">Back</a></button>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>

</html>
