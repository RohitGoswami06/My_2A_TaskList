<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Icons</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center fw-bold mb-5">
            Bootstrap Icons UI
        </h2>


        <div class="row g-4">

            <!-- Profile Card -->
            <div class="col-md-4">

                <div class="bg-white p-4 rounded-4 shadow-sm text-center">

                    <i class="bi bi-person-circle fs-1 text-primary"></i>

                    <h4 class="fw-bold mt-3">
                        Profile
                    </h4>

                    <p class="text-secondary">
                        Manage your profile information.
                    </p>

                    <button class="btn btn-primary">
                        <i class="bi bi-person me-2"></i>
                        View Profile
                    </button>

                </div>

            </div>


            <!-- Message Card -->
            <div class="col-md-4">

                <div class="bg-white p-4 rounded-4 shadow-sm text-center">

                    <i class="bi bi-chat-dots fs-1 text-success"></i>

                    <h4 class="fw-bold mt-3">
                        Messages
                    </h4>

                    <p class="text-secondary">
                        Check your latest messages.
                    </p>

                    <button class="btn btn-success">
                        <i class="bi bi-envelope me-2"></i>
                        Messages
                    </button>

                </div>

            </div>


            <!-- Settings Card -->
            <div class="col-md-4">

                <div class="bg-white p-4 rounded-4 shadow-sm text-center">

                    <i class="bi bi-gear fs-1 text-danger"></i>

                    <h4 class="fw-bold mt-3">
                        Settings
                    </h4>

                    <p class="text-secondary">
                        Manage your account settings.
                    </p>

                    <button class="btn btn-danger">
                        <i class="bi bi-gear me-2"></i>
                        Settings
                    </button>

                </div>

            </div>


            <!-- Notification -->
            <div class="col-md-6">

                <div class="bg-white p-4 rounded-4 shadow-sm d-flex align-items-center gap-3">

                    <i class="bi bi-bell fs-2 text-warning"></i>

                    <div>
                        <h5 class="fw-bold mb-1">
                            Notifications
                        </h5>

                        <p class="text-secondary mb-0">
                            You have 3 new notifications.
                        </p>
                    </div>

                </div>

            </div>


            <!-- Shopping Cart -->
            <div class="col-md-6">

                <div class="bg-white p-4 rounded-4 shadow-sm d-flex align-items-center gap-3">

                    <i class="bi bi-cart3 fs-2 text-primary"></i>

                    <div>
                        <h5 class="fw-bold mb-1">
                            Shopping Cart
                        </h5>

                        <p class="text-secondary mb-0">
                            You have 2 items in your cart.
                        </p>
                    </div>

                </div>

            </div>

        </div>

        <a href="index.html" class="btn btn-primary  text-center mt-5">Back</a>

    </div>

</body>

</html>
